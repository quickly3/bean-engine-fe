[package]
name = "bean-engine-fe"
version = "0.0.0"
description = "Search Gank Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "bean_engine_fe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
